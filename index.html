  { id: "peach", g: "pastel", he: "אפרסק", en: "Peach", fr: "Pêche", c: { bg: "#fff4ec", card: "#fffbf8", text: "#3b2a20", muted: "#8c6e5c", line: "#f6e0d0", accent: "#e2703a" } },

  { id: "lemon", g: "pastel", he: "לימון", en: "Lemon", fr: "Citron", c: { bg: "#fffbe6", card: "#fffef6", text: "#33300f", muted: "#7d7650", line: "#f0e7b8", accent: "#c99a00" } },

  { id: "tangerine", g: "vivid", he: "מנדרינה", en: "Tangerine", fr: "Mandarine", c: { bg: "#fff3e6", card: "#ffffff", text: "#2a1606", muted: "#7a5a40", line: "#ffd2a6", accent: "#ff6a00" } },
  { id: "lime", g: "vivid", he: "ליים", en: "Lime", fr: "Citron vert", c: { bg: "#f4ffe0", card: "#ffffff", text: "#142006", muted: "#56693a", line: "#d6f0a8", accent: "#7ed000" } },
  { id: "oled", g: "dark", he: "שחור מוחלט", en: "Pure black", fr: "Noir absolu", c: { bg: "#000000", card: "#0e0e10", text: "#f2f2f2", muted: "#9a9aa0", line: "#232327", accent: "#8ab4ff" } },
  { id: "neon", g: "dark", he: "ניאון", en: "Neon", fr: "Néon", c: { bg: "#0b0b10", card: "#15151d", text: "#f0f0ff", muted: "#9a9ab5", line: "#2a2a3a", accent: "#39ff14", ok: "#39ff14", warn: "#ffd60a", err: "#ff2e63" } },
  { id: "cyber", g: "dark", he: "סייבר", en: "Cyber", fr: "Cyber", c: { bg: "#0d0221", card: "#1a0b3a", text: "#f6e9ff", muted: "#a98ccc", line: "#341a66", accent: "#ff2bd6", ok: "#2de2e6", warn: "#ffd319", err: "#ff3864" } },
  { id: "forest", g: "dark", he: "יער", en: "Forest", fr: "Forêt", c: { bg: "#0f1a14", card: "#16251d", text: "#e3efe7", muted: "#8fa898", line: "#24382c", accent: "#5fd08a" } },
  { id: "ocean", g: "dark", he: "אוקיינוס", en: "Ocean", fr: "Océan", c: { bg: "#0b1526", card: "#12203a", text: "#e4eefc", muted: "#8ea3c2", line: "#1f3254", accent: "#4cc9f0" } },
  { id: "grape", g: "dark", he: "ענבים", en: "Grape", fr: "Raisin", c: { bg: "#1e1b2e", card: "#282540", text: "#f1effa", muted: "#a49fc4", line: "#38345a", accent: "#bd93f9" } },
  { id: "coffee", g: "dark", he: "קפה", en: "Coffee", fr: "Café", c: { bg: "#1c1612", card: "#26201a", text: "#f1e8df", muted: "#a8968a", line: "#3a3029", accent: "#e0a96d" } },
  { id: "dusk", g: "dark", he: "פסטל לילי", en: "Pastel night", fr: "Pastel de nuit", c: { bg: "#1d1b26", card: "#262433", text: "#ece9f5", muted: "#a7a2bd", line: "#363347", accent: "#f5b8d0", ok: "#a8e6cf", warn: "#ffd3a5", err: "#ff9aa2" } },
];
const TH_FIELDS = ["bg", "card", "text", "muted", "line", "accent", "ok", "warn", "err"];
const TH_STATUS = { light: { ok: "#2b8a3e", warn: "#e8590c", err: "#c92a2a" }, dark: { ok: "#69db7c", warn: "#ffa94d", err: "#ff8787" } };
const TH_VARS = ["--bg", "--card", "--text", "--muted", "--line", "--accent", "--accent-t", "--accent-d", "--accent-soft", "--on-accent", "--ok", "--warn", "--err", "--new", "--newbg", "--updbg", "--okbg", "--row", "--track", "--mixk", "--mixp"];
const thRGB = h => { h = String(h).replace("#", ""); if (h.length === 3) h = h.replace(/./g, "$&$&"); return [0, 2, 4].map(i => parseInt(h.substr(i, 2), 16) || 0); };
const thHex = a => "#" + a.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, "0")).join("");
const thMix = (a, b, t) => { const x = thRGB(a), y = thRGB(b); return thHex(x.map((v, i) => v + (y[i] - v) * t)); };     // t = share of b
const thLum = h => { const [r, g, b] = thRGB(h).map(v => { v /= 255; return v <= 0.03928 ? v / 12.92 : Math.pow((v + 0.055) / 1.055, 2.4); }); return 0.2126 * r + 0.7152 * g + 0.0722 * b; };
const thContrast = (a, b) => { const x = thLum(a), y = thLum(b); return (Math.max(x, y) + 0.05) / (Math.min(x, y) + 0.05); };
const thIsDark = c => thLum(c.bg) < 0.2;
/* the few colours a theme sets -> every colour the page uses (soft backgrounds, readable text on the main colour, …) */
function themeVars(c0) {
  const dark = thIsDark(c0), c = Object.assign({}, TH_STATUS[dark ? "dark" : "light"], c0);
  let at = c.accent; for (let i = 0; i < 12 && thContrast(at, c.card) < 3.2; i++) at = thMix(at, c.text, 0.2);    // the main colour as text: darkened until readable
  return { dark, v: { "--bg": c.bg, "--card": c.card, "--text": c.text, "--muted": c.muted, "--line": c.line, "--accent": c.accent, "--accent-t": at,
    "--accent-d": thMix(c.accent, dark ? "#ffffff" : "#000000", 0.15), "--accent-soft": thMix(c.card, c.accent, dark ? 0.22 : 0.14),
    "--on-accent": thContrast("#ffffff", c.accent) >= 2.5 ? "#ffffff" : "#111111", "--ok": c.ok, "--warn": c.warn, "--err": c.err,
    "--new": at, "--newbg": thMix(c.card, c.accent, dark ? 0.2 : 0.1), "--updbg": thMix(c.card, c.warn, dark ? 0.2 : 0.12), "--okbg": thMix(c.card, c.ok, dark ? 0.2 : 0.12),
    "--row": thMix(c.card, c.text, dark ? 0.05 : 0.025), "--track": thMix(c.bg, c.text, dark ? 0.09 : 0.07), "--mixk": dark ? "#fff" : "#000", "--mixp": dark ? "88%" : "68%" } };
}
/* the colours a theme setting stands for (null = the original, which follows the phone's light/dark setting) */
function themeColors(th) {
  if (th && th.id === "custom" && th.c) return th.c;
  const p = THEMES.find(x => x.id === (th && th.id)); return p && p.c ? p.c : null;
}
function applyTheme(th) {
  const r = document.documentElement, c = themeColors(th), meta = document.querySelector('meta[name="theme-color"]');
  for (const k of TH_VARS) r.style.removeProperty(k);
  r.style.removeProperty("color-scheme"); r.dataset.theme = c ? (th.id || "custom") : "auto";
  if (!c) { if (meta) meta.content = "#3b5bdb"; return; }
  const t = themeVars(c); for (const k in t.v) r.style.setProperty(k, t.v[k]);
  r.style.colorScheme = t.dark ? "dark" : "light"; if (meta) meta.content = c.bg;
}
try { const k = (/\/beta\//.test(location.pathname) ? "mtb_" : "mt_") + "prefs"; applyTheme((JSON.parse(localStorage.getItem(k) || "{}") || {}).theme); } catch (e) {}

<style>
:root{
  --mixk:#000; --mixp:68%; --accent-t:var(--accent); --on-accent:#fff;
  --bg:#f4f6fb; --card:#ffffff; --text:#1d2433; --muted:#667085; --line:#e4e8f1;
  --accent:#3b5bdb; --accent-d:#2f49b3; --accent-soft:#e8edff; --ok:#2b8a3e; --warn:#e8590c; --err:#c92a2a;
  --new:#1c7ed6; --newbg:#e7f1fd; --updbg:#fff0e0; --okbg:#e6f6ea; --row:#f7f8fc; --track:#eceff5;
}
@media (prefers-color-scheme: dark){
  :root{
    --mixk:#fff; --mixp:88%;
    --bg:#12151d; --card:#1a1f2b; --text:#e7eaf2; --muted:#98a2b3; --line:#2a3141;
    --accent:#7c93ff; --accent-d:#9aabff; --accent-soft:#252d4d; --ok:#69db7c; --warn:#ffa94d; --err:#ff8787;
    --new:#74c0fc; --newbg:#1c2b3d; --updbg:#3a2a1a; --okbg:#1d3326; --row:#202637; --track:#252a36;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{font-family:system-ui,-apple-system,"Segoe UI","Heebo",Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15.5px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);padding:9px 14px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
button.link{border:0;background:none;color:var(--accent-t);padding:6px 4px}
button:disabled{opacity:.5}
input[type=text],input[type=search],input[type=password],select{font:inherit;font-size:16px;width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
select{width:auto}
.hint{color:var(--muted);font-size:13px}
.err{color:var(--err)}
[hidden]{display:none!important}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:8px;background:var(--card);border-bottom:1px solid var(--line);
  padding:max(10px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) 10px max(14px,env(safe-area-inset-left))}
.top .ttl{flex:1;min-width:0;display:flex;flex-direction:column}
.top .ttl b{font-size:18px}
.top .logo{flex:none;width:34px;height:34px;border-radius:9px;box-shadow:0 2px 8px #2a186833}
.wm{font-weight:800;letter-spacing:-.01em;unicode-bidi:isolate}
.wm span{margin-inline-start:1px;background:linear-gradient(120deg,var(--accent-t),#7b5cff 60%,#e0a020);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand{display:flex;align-items:center;gap:12px;margin:2px 0 12px}
.brand img{width:56px;height:56px;border-radius:15px;box-shadow:0 6px 18px #2a186840}
.brand .wm{font-size:26px;display:block;line-height:1.1}
.brand .hint{margin-top:2px}
.top .ttl .hint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ic{width:42px;height:42px;padding:0;font-size:19px;display:inline-flex;align-items:center;justify-content:center;border-radius:12px}
.ic.spin{animation:s 1s linear infinite}
@keyframes s{to{transform:rotate(360deg)}}
main{max-width:720px;margin:0 auto;padding:12px max(12px,env(safe-area-inset-right)) max(30px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- layout: phone = one pane + bottom tabs, tablet/desktop = side by side ---------- */
body.app main{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
body.app[data-view=dash] #tasks,body.app[data-view=dash] #ttv{display:none}
body.app[data-view=tasks] #dash,body.app[data-view=tasks] #ttv{display:none}
body.app[data-view=tt] #dash,body.app[data-view=tt] #tasks{display:none}
.sech{display:none}
.tabbar{position:fixed;inset-inline:0;bottom:0;z-index:12;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 10px max(8px,env(safe-area-inset-bottom))}
.tabbar button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12.5px;color:var(--muted);padding:6px 4px;border-radius:12px}
.tabbar button span{font-size:20px;line-height:1.1}
.tabbar button.on{color:var(--accent-t);background:var(--accent-soft);font-weight:700}
.tabbar .b{position:relative}
.tabbar .badge{position:absolute;inset-block-start:2px;inset-inline-end:calc(50% - 26px);min-width:18px;padding:0 5px;border-radius:99px;background:var(--err);color:#fff;font-size:11px;font-weight:700;font-style:normal}
/* tablet / desktop: every card is placed on one grid (the tab sections dissolve into it) */
@media (min-width:760px){
  main{max-width:1440px;padding-inline:20px}
  body.app main{padding-bottom:30px}
  .tabbar{display:none!important}
  body.app #dash,body.app #ttv{display:contents!important}
  body.app #tasks{display:block!important}
  #app{display:grid;gap:14px;align-items:start;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);
    grid-template-areas:"hero stats" "exams today" "sem sem" "tt tt" "tasks week" "tasks month" "tasks news" "tasks load" "tasks ics" "tasks .";
    grid-template-rows:auto auto auto auto auto auto auto auto auto 1fr}
  #app .dcard,#app .stats{margin:0}
  #hero{grid-area:hero} #stats{grid-area:stats} #todayCard{grid-area:today} #examCard{grid-area:exams} #semCard{grid-area:sem} #ttCard{grid-area:tt}
  #weekCard{grid-area:week} #monthCard{grid-area:month} #newsCard{grid-area:news} #loadCard{grid-area:load} #icsCard{grid-area:ics} #tasks{grid-area:tasks}
  #hero,#stats,#todayCard,#examCard{align-self:stretch}
  .sech{display:flex;align-items:baseline;gap:10px;font-size:19px;font-weight:800;margin:2px 2px 10px}
  .sech .hint{font-weight:400;font-size:13px}
}
@media (min-width:1100px){
  #app{gap:16px;grid-template-columns:repeat(3,minmax(0,1fr));
    grid-template-areas:"hero stats exams" "sem sem sem" "today tt tt" "week tt tt" "month tasks tasks" "news tasks tasks" "load tasks tasks" "ics tasks tasks" ". tasks tasks";
    grid-template-rows:auto auto auto auto auto auto auto auto 1fr}
  #todayCard{align-self:start}
}

/* ---------- setup ---------- */
#setup .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-top:10px;max-width:620px;margin-inline:auto}
#setup h2{margin:0 0 6px;font-size:20px}
#setup label{display:block;font-weight:600;margin:14px 0 6px}
#setup input{direction:ltr;text-align:left}
#setup .step{margin:14px 0}
.btn{display:block;text-align:center;text-decoration:none;border-radius:10px;padding:11px 14px;margin-top:8px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--on-accent)}
details{margin:10px 0}
summary{cursor:pointer;padding:4px 0;font-weight:600}
/* versions + reminders */
.betatag{font-size:10.5px;font-weight:800;letter-spacing:.06em;background:var(--warn);color:#fff;border-radius:6px;padding:1px 6px;vertical-align:3px}
.wnv{margin:8px 0}
.calbtns{display:flex;flex-direction:column;gap:8px;margin:10px 0}
.calbtns.busy{opacity:.5;pointer-events:none}
#updBar{position:fixed;inset-inline:12px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:60;display:flex;align-items:center;gap:10px;justify-content:space-between;background:var(--accent);color:var(--on-accent,#fff);border-radius:14px;padding:10px 12px 10px 14px;box-shadow:0 8px 24px rgba(0,0,0,.25);font-weight:600;max-width:520px;margin:0 auto}
#updBar[hidden]{display:none}#updBar button{background:var(--on-accent,#fff);color:var(--accent);border:0;border-radius:10px;padding:8px 14px;font-weight:700;white-space:nowrap}
.calg{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:4px 0 10px;background:var(--card2,transparent)}.calg ol{margin:6px 0;padding-inline-start:20px;font-size:14px;line-height:1.5}.calg .calbtns{margin:8px 0 0}
.dalist{display:flex;flex-direction:column;gap:6px}
.darow{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:var(--card)}
.darow.off{opacity:.55}
.darow .dn{flex:1;font-size:15px}
.darow button.mv{width:38px;height:36px;padding:0;font-size:16px}
.darow label{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.dhide{display:none!important}
.mineadd{width:100%;margin:2px 0 8px;border-style:dashed}
.fld{display:flex;flex-direction:column;gap:4px;margin-bottom:10px;font-size:14px;color:var(--muted)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:16px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:10px;padding:9px 10px;width:100%}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.link.danger{color:var(--err)}
.ttnone{display:flex;flex-direction:column;gap:8px;align-items:stretch}
.inst{display:flex;gap:12px;align-items:center;margin-bottom:8px}
.inst img{width:52px;height:52px;border-radius:14px;flex:none}
.inststeps{margin:6px 0 10px;padding-inline-start:22px;line-height:1.6}
.seg.cats{display:flex;width:100%;margin:8px 0 4px}
.seg.cats button{flex:1;padding-inline:4px;white-space:nowrap}
.seg.cats i{font-style:normal;font-size:12px;opacity:.75}
.hidbar{display:flex;justify-content:center;margin:10px 0}
#toast button{margin-inline-start:12px;background:none;border:0;color:#9db4ff;font-weight:700;padding:0}
.gvid{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0 4px;background:var(--row)}
.gvt{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;margin-bottom:8px}
.gvbox{display:flex;gap:12px;align-items:flex-start}
.gvbox video{flex:none;width:min(150px,40%);aspect-ratio:384/848;border-radius:14px;background:#000;border:3px solid #111;box-shadow:0 4px 16px #0003}
.gvcap{margin:0;padding-inline-start:20px;font-size:14px;line-height:1.45;display:flex;flex-direction:column;gap:6px;color:var(--muted)}
.gvcap li.on{color:var(--text);font-weight:700}
.gvcap li.on::marker{color:var(--accent-t)}
.lvsteps{margin:8px 0 10px;padding-inline-start:22px;line-height:1.6}
.lvsteps li{margin-bottom:8px}
.lvsteps b{color:var(--accent-t)}
.wnx{border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin-top:10px;display:flex;flex-direction:column;gap:8px}
.thgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin:6px 0 4px}
.thgrid.sm{grid-template-columns:repeat(3,1fr)}
.thsw{padding:5px;border-radius:12px;display:flex;flex-direction:column;gap:5px;align-items:stretch;text-align:center;font-size:12.5px}
.thsw.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent);font-weight:700}
.thp{display:block;height:54px;border-radius:8px;background:var(--sb);padding:7px;border:1px solid #0000001a}
.thc{display:flex;flex-direction:column;gap:4px;height:100%;border-radius:6px;background:var(--sc);padding:6px;font-style:normal;box-shadow:0 1px 2px #0002}
.thc b{display:block;height:6px;width:70%;border-radius:3px;background:var(--st)}
.thc em{display:block;height:5px;width:50%;border-radius:3px;background:var(--sm)}
.thc u{display:block;height:9px;width:45%;border-radius:99px;background:var(--sa);margin-top:auto}
.thn{line-height:1.25}
.thgrp{margin-top:14px;font-weight:700}
.throw{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid var(--line)}
.throw input[type=color]{width:54px;height:34px;padding:2px;border:1px solid var(--line);border-radius:8px;background:var(--card)}
.thmore summary{cursor:pointer;color:var(--accent-t);padding:8px 0}
.wnv ul{margin:6px 0 0;padding-inline-start:20px;line-height:1.6}
.rgrp{display:grid;gap:8px;margin:12px 0}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border-radius:99px;padding:7px 13px;font-size:14px}
.rchip.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-t);font-weight:700}
.rchip.on::before{content:"✓ "}
.rmin{flex-direction:row!important;align-items:center;gap:10px!important;font-weight:400!important}
.rmin select{width:auto!important}
.remcard{display:grid;gap:8px}
.remcard .remnew{font-weight:700;color:var(--warn)}
/* first-run tour */
.tour{position:fixed;inset:0;z-index:50;background:#0009;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom))}
.tbox{position:relative;background:var(--card);border-radius:20px;width:100%;max-width:440px;padding:18px 18px 16px;box-shadow:0 20px 60px #0005;display:flex;flex-direction:column;gap:6px;max-height:100%;overflow:auto}
.tskip{position:absolute;inset-block-start:8px;inset-inline-end:10px;font-size:14px}
.tart{height:190px;border-radius:14px;background:var(--row);display:flex;align-items:center;justify-content:center;overflow:hidden;margin-top:26px;padding:12px;pointer-events:none}
.tart>*{width:100%;max-width:330px}
.tbox h3{margin:10px 0 0;font-size:20px;text-wrap:balance}
.tbox p{margin:0;color:var(--muted);line-height:1.55;font-size:15px;min-height:4.6em}
.tfoot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px}
.tdots{display:flex;gap:6px}
.tdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tdots i.on{background:var(--accent);width:18px;border-radius:99px}
.tbtns{display:flex;gap:8px}
@media (prefers-reduced-motion:no-preference){ .tart>*{animation:tin .35s ease} }
@keyframes tin{from{opacity:0;transform:translateY(8px)}}
/* tour pictures, drawn with the app's own pieces */
.tm-hero{border-radius:14px;color:#fff;padding:12px 14px;background:linear-gradient(135deg,color-mix(in srgb,#fa7a17 72%,#000),color-mix(in srgb,#fa7a17 55%,#3b1470))}
.tm-hero small{opacity:.85;display:block;font-size:12px}
.tm-hero b{display:block;font-size:17px;margin:2px 0}
.tm-hero span{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums}
.tm-tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}
.tm-tiles div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:11px;color:var(--muted)}
.tm-tiles div b{display:block;font-size:18px;color:var(--text)}
.tm-tiles div:first-child b{color:var(--err)}
.tart .task{margin:0;font-size:14px}
.tart .task .tname{font-size:15px}
.tm-tt{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;height:136px}
.tm-tt>div{position:relative;background:var(--card);border-radius:8px}
.tm-tt i{position:absolute;inset-inline:3px;border-radius:7px;color:#fff;font-style:normal;font-size:11.5px;font-weight:700;padding:4px 5px;background:var(--c)}
.tm-tt i.att{background:repeating-linear-gradient(135deg,var(--c) 0 7px,color-mix(in srgb,var(--c) 80%,#000) 7px 14px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#000)}
.tm-file{display:inline-flex;align-items:center;gap:6px;margin-bottom:8px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:4px 10px;font-size:12.5px}
.tm-sem>b{display:block;font-size:16px;margin-bottom:8px}
.tm-sem>b small{font-size:13px;color:var(--muted);font-weight:600}
.tart .er{margin:10px 0 0;background:var(--card)}
.tm-steps{display:grid;gap:8px;font-size:14px}
.tm-steps div{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.tm-steps span{font-size:22px;flex:none;width:30px;text-align:center}
/* setup guide */
.gsteps{list-style:none;margin:14px 0 6px;padding:0;display:grid;gap:12px}
.gstep{border:1px solid var(--line);border-radius:14px;padding:14px;background:var(--row)}
.gstep.flash{animation:fl 1.2s ease 2}
@keyframes fl{50%{box-shadow:0 0 0 4px var(--warn)}}
.gh{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.gh b{font-size:16.5px}
.gn{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800}
.gp{margin:6px 0;line-height:1.55}
.gdo{font-weight:600;background:var(--accent-soft);color:var(--accent-t);border-radius:10px;padding:8px 10px}
.gnote{font-size:13.5px;color:var(--muted);margin-top:8px;line-height:1.5}
.gnote code{direction:ltr;unicode-bidi:isolate;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:0 5px;font-size:12.5px}
.gnote.warn{color:var(--text)}
.gtabs{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin:6px 0 10px;background:var(--card)}
.gtabs button{border:0;border-radius:0;padding:7px 12px;font-size:14px;background:none}
.gtabs button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
.ill{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--card);max-width:340px;margin:0 auto;box-shadow:0 4px 18px #0001}
.ill-bar{background:var(--row);border-bottom:1px solid var(--line);padding:7px 10px;font-size:12px;color:var(--muted);direction:ltr;text-align:left}
.ill-bar span{display:inline-block;background:var(--card);border-radius:99px;padding:2px 10px}
.ill-page{position:relative;padding:16px 14px 150px;text-align:start}
.ill-line{display:block;height:8px;border-radius:4px;background:var(--track);width:85%;margin-bottom:8px}
.ill-line.s{width:55%}
.ill-link{display:inline-block;margin-top:8px;color:#1a73e8;text-decoration:underline;font-size:15px;font-weight:600;padding:2px 4px;border-radius:4px;background:#1a73e81f}
.ill-finger{position:absolute;inset-inline-start:38px;top:56px;font-size:30px;filter:drop-shadow(0 2px 2px #0004)}
.ill-finger::after{content:"";position:absolute;left:2px;top:-6px;width:22px;height:22px;border-radius:50%;border:3px solid #1a73e8;opacity:0}
@media (prefers-reduced-motion:no-preference){ .ill-finger::after{animation:press 1.6s ease-out infinite} }
@keyframes press{0%{opacity:.9;transform:scale(.6)}70%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
.ill-menu{position:absolute;inset-inline-start:56px;top:92px;inset-inline-end:10px;background:var(--card);border:1px solid var(--line);border-radius:10px;box-shadow:0 6px 22px #0003;font-size:13.5px;overflow:hidden}
.ill-menu div{padding:7px 10px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;align-items:center}
.ill-menu div:last-child{border-bottom:0}
.ill-menu .ok{background:color-mix(in srgb,var(--ok) 16%,var(--card));font-weight:700;color:var(--text)}
.ill-menu .no{color:var(--muted);text-decoration:line-through}
.ill-menu .ok::after{content:"✓";color:var(--ok);font-weight:800}
.ill-menu .no::after{content:"✕";color:var(--err);text-decoration:none}
.ill-page.pc .ill-finger{display:none}
.ill-menu .hd{font-size:11.5px;color:var(--muted);direction:ltr;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;display:block}
.langrow{display:flex;justify-content:flex-end;align-items:center;gap:6px;margin:0 0 4px}
.langrow select{font-size:14px;padding:5px 8px}

/* ---------- dashboard ---------- */
.dcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.dcard .ch{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700;margin-bottom:10px}
.dcard .ch .hint{font-weight:400}
.hero{--c:var(--accent);position:relative;overflow:hidden;border:0;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 72%,#000),color-mix(in srgb,var(--c) 55%,#3b1470))}
.hero .gr{opacity:.9;font-size:14px}
.hero .lbl{margin-top:10px;font-size:12.5px;opacity:.85;letter-spacing:.03em}
.hero .nm{font-size:19px;font-weight:800;margin:2px 0 4px;line-height:1.3}
.hero .crs{display:inline-block;font-size:12.5px;padding:2px 10px;border-radius:99px;background:#ffffff2e}
.hero .big{display:block;margin-top:10px;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums;color:#fff!important}
.hero .when{font-size:13.5px;opacity:.9}
.hero button{margin-top:12px;background:#ffffff26;border:1px solid #ffffff55;color:#fff;font-weight:700}
.hero.done{background:linear-gradient(135deg,#2b8a3e,#0c8599)}
.hero .emo{font-size:34px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-bottom:12px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:start;display:flex;flex-direction:column;gap:2px;min-height:84px}
.tile .n{font-size:26px;font-weight:800;line-height:1.1}
.tile .l{font-size:13px;color:var(--muted)}
.tile.late .n{color:var(--err)}
.tile.today .n{color:var(--warn)}
.tile.ring{flex-direction:row;align-items:center;gap:10px}
.tile.ring svg{flex:none}
.tile.ring .rt{display:flex;flex-direction:column}
.tile:active{transform:scale(.98)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wd{border:0;background:none;padding:4px 2px;border-radius:12px;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:132px}
.wd .dn{font-size:11.5px;color:var(--muted)}
.wd .dd{font-size:15px;font-weight:700;width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.wd.today .dd{background:var(--accent);color:var(--on-accent)}
.wd .bars{display:flex;flex-direction:column;gap:3px;width:100%;align-items:center;flex:1}
.wd .bar{width:72%;height:14px;border-radius:5px;background:var(--c)}
.wd .bar.dn2{background:transparent;border:2px solid var(--c);opacity:.55}
.wd .more{font-size:11px;color:var(--muted)}
.wd .cnt{font-size:11.5px;font-weight:700;color:var(--muted);min-height:16px}
.wd.sel,.md.sel{outline:2px solid var(--accent);outline-offset:-2px}
.month{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.month .wh{font-size:11px;color:var(--muted);text-align:center;padding-bottom:2px}
.md{border:0;background:var(--row);border-radius:10px;min-height:52px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;gap:3px}
.md.out{background:none;opacity:.35}
.md.past{opacity:.6}
.md .d{font-size:13px;font-weight:600;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.md.today .d{background:var(--accent);color:var(--on-accent)}
.md .dots{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;max-width:100%}
.md .dot{width:7px;height:7px;border-radius:50%;background:var(--c)}
.md .dot.dn2{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c)}
.md .pl{font-size:10px;color:var(--muted);line-height:1}
.md.hasLate{box-shadow:inset 0 -3px 0 var(--err)}
.mnav{display:flex;gap:4px}
.mnav button{padding:4px 10px}
.load .lr{display:flex;align-items:center;gap:8px;padding:5px 4px;border-radius:10px;width:100%;border:0;background:none;text-align:start}
.load .lr .ln{width:38%;min-width:0;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.load .lr .lb{flex:1;height:12px;border-radius:99px;background:var(--track);overflow:hidden;display:flex}
.load .lr .lb i{display:block;height:100%;background:var(--c)}
.load .lr .lb i.lt{background:repeating-linear-gradient(45deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 55%,#fff) 4px,color-mix(in srgb,var(--c) 55%,#fff) 8px)}
.load .lr .lc{font-size:12.5px;color:var(--muted);min-width:26px;text-align:end;font-variant-numeric:tabular-nums}
.dact{display:flex;flex-direction:column;gap:6px}
.dact button{width:100%}
.ch .link{padding:2px 4px;font-weight:600;font-size:14px}

/* semester progress: one dashed piece per week, the current week fills day by day */
.sem .big{font-size:22px;font-weight:800;line-height:1.2;display:flex;flex-wrap:wrap;align-items:center;gap:4px 12px}
.sem .big small{font-size:14px;font-weight:600;color:var(--muted);margin-inline-start:6px}
.sem .big small.pc{margin:0;padding:2px 9px;border-radius:99px;background:var(--accent-soft);color:var(--accent-t);font-size:12.5px}
.sem .sub{color:var(--muted);font-size:14px;margin:2px 0 12px}
.sem .sub b{color:var(--text)}
.sbar{display:flex;gap:4px;align-items:center;height:16px}
.sg{position:relative;height:12px;border-radius:4px;background:var(--track);overflow:visible;min-width:3px}
.sg>b{position:absolute;inset-block:0;inset-inline-start:0;border-radius:4px;background:var(--accent)}
.sg.x{background:color-mix(in srgb,var(--warn) 22%,var(--track))}
.sg.x>b{background:var(--warn)}
.sg.gap{height:2px;background:none;border-top:2px dotted var(--line)}
.sg.cur{height:16px;box-shadow:0 0 0 2px color-mix(in srgb,var(--accent) 35%,transparent)}
.sg.x.cur{box-shadow:0 0 0 2px color-mix(in srgb,var(--warn) 40%,transparent)}
.sg.cur>b::after{content:"";position:absolute;inset-inline-end:-5px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;background:var(--card);border:3px solid var(--accent)}
.sg.x.cur>b::after{border-color:var(--warn)}
.snum{display:flex;gap:4px;margin-top:4px;font-size:10.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.snum span{text-align:center;min-width:3px;overflow:hidden}
.snum span.cur{color:var(--accent-t);font-weight:800}
.slbl{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:12.5px;color:var(--muted)}
.slbl .xl{color:var(--warn);font-weight:600}
.sem .guess{margin-top:8px;font-size:12.5px;color:var(--muted)}
.sem .guess button{font-size:12.5px;padding:0 4px}

/* today's classes */
.tr{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--row);border-inline-start:5px solid var(--c);margin-bottom:6px;width:100%;border-block:0;border-inline-end:0;text-align:start}
.tr .tm{font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:42px;line-height:1.3}
.tr .tb{flex:1;min-width:0;display:flex;flex-direction:column}
.tr .tb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .tb small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr .ts{font-size:12.5px;font-weight:700;color:var(--muted);text-align:end}
.tr.past{opacity:.5}
.tr.now{background:color-mix(in srgb,var(--c) 16%,var(--card));box-shadow:0 0 0 2px var(--c)}
.tr.now .ts{color:var(--ct,var(--text))}
.tr.next .ts{color:var(--accent-t)}
.today .nx{color:var(--muted);font-size:14px;margin-top:4px}
.today .nx b{color:var(--text)}

/* weekly timetable */
.tt{--pph:58px}
.ttb{display:flex;gap:6px}
.ttb button{padding:6px 12px;font-size:14px}
.ttgrid{display:grid;grid-template-columns:34px repeat(var(--nd),minmax(0,1fr));column-gap:4px}
.ttgrid .th{text-align:center;font-size:12.5px;font-weight:700;color:var(--muted);padding:4px 0 6px}
.ttgrid .th.on{color:var(--accent-t)}
.ttgrid .th.on span{background:var(--accent);color:var(--on-accent);border-radius:99px;padding:1px 8px}
.tthr{position:relative;height:calc(var(--pph) * var(--rows))}
.tthr span{position:absolute;inset-inline-end:2px;font-size:11px;color:var(--muted);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.tthr span:first-child{transform:none}
.ttc{position:relative;height:calc(var(--pph) * var(--rows));border-radius:10px;background-color:var(--row);
  background-image:repeating-linear-gradient(to bottom,var(--line) 0 1px,transparent 1px var(--pph))}
.ttc.on{background-color:var(--accent-soft)}
.tte{position:absolute;border:0;border-radius:9px;padding:4px 3px;overflow:hidden;color:#fff;text-align:start;display:flex;flex-direction:column;gap:1px;
  background:var(--c);font-size:11.5px;line-height:1.25;box-shadow:0 1px 0 #0001}
.tte b{font-size:11.5px;line-height:1.2;overflow-wrap:break-word}
.tte span{opacity:.92;overflow-wrap:break-word}
.tte .tk,.tte .tm{display:none}
.tte.now{box-shadow:0 0 0 3px var(--card),0 0 0 5px var(--c)}
.ttnow{position:absolute;inset-inline:-3px;height:2px;background:var(--err);z-index:2;pointer-events:none}
.ttnow::before{content:"";position:absolute;inset-inline-start:-3px;top:-4px;width:10px;height:10px;border-radius:50%;background:var(--err)}
.ttempty{padding:18px 6px;color:var(--muted);text-align:center;line-height:1.6}
.ttempty .eb2{display:flex;flex-direction:column;gap:8px;max-width:340px;margin:12px auto 0}
@media (min-width:760px){ .tt{--pph:54px} .tte{font-size:12px;padding:5px 7px} .tte b{font-size:13.5px} .tte .tk,.tte .tm{display:block} .tte .pl{order:2} .tte .tk{order:1} .tte .tm{order:3} }

/* exams */
.er{display:flex;align-items:center;gap:10px;width:100%;text-align:start;padding:8px 10px;border-radius:12px;background:var(--row);border:0;border-inline-start:5px solid var(--c);margin-bottom:6px}
.er .eb{flex:1;min-width:0;display:flex;flex-direction:column}
.er .eb b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.er .eb small{color:var(--muted);font-size:12.5px;line-height:1.5}
.er .ec{text-align:center;min-width:54px;line-height:1.1}
.er .ec .en{display:block;font-size:22px;font-weight:800;font-variant-numeric:tabular-nums}
.er .ec .eu{font-size:11.5px;color:var(--muted)}
.er .ec .cd{font-size:12px;display:block;max-width:120px}
.er.b{opacity:.75}
.er.soon .ec .en{color:var(--warn)}
.exempty{color:var(--muted);font-size:14px}
.lv{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn);white-space:nowrap}
.exnote{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.45}
.xsug.lvrow{color:var(--warn);justify-content:space-between}
.exempty button{margin-top:8px;width:100%}
.xrow{border-bottom:1px solid var(--line);padding:10px 0}
.xrow:last-child{border-bottom:0}
.xrow .xn{display:flex;align-items:center;gap:8px;font-weight:700;margin-bottom:6px}
.xrow .xn i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.xrow .xm{display:grid;grid-template-columns:62px minmax(0,1fr);gap:6px 8px;align-items:center;font-size:14px}
.xrow input[type=datetime-local]{width:100%;min-width:0}
.xsug{grid-column:1/-1;font-size:13px;color:var(--accent-t);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.xsug button{padding:3px 10px;font-size:13px}
.md .dot.xm{border-radius:2px;width:9px;height:9px;box-shadow:0 0 0 1.5px var(--card),0 0 0 3px var(--c)}
.wd .bar.xm{background:repeating-linear-gradient(135deg,var(--c),var(--c) 4px,color-mix(in srgb,var(--c) 45%,var(--card)) 4px,color-mix(in srgb,var(--c) 45%,var(--card)) 8px);height:16px}
.scl label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-weight:400}
.scl label i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.scl label span{flex:1;min-width:0}
.scl small{color:var(--muted)}
.ttfoot{display:flex;justify-content:space-between;gap:8px;margin-top:8px}
.ttfoot button{font-size:13px}
.tte .lk{font-size:10px;margin-inline-start:3px}
/* mandatory attendance: same colour, striped, with a darker rim */
.tte.att{background:repeating-linear-gradient(135deg,var(--c) 0 7px,color-mix(in srgb,var(--c) 80%,#000) 7px 14px);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#000)}
.tte.att.now{box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--c) 55%,#000),0 0 0 3px var(--card),0 0 0 5px var(--c)}
.tte.att b,.tte.att span{text-shadow:0 1px 1px #0005}
.ttleg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-top:8px}
.ttleg i{width:20px;height:12px;border-radius:3px;background:repeating-linear-gradient(135deg,#868e96 0 4px,#495057 4px 8px)}
.tr.att{border-inline-start-style:double;border-inline-start-width:7px}
.atb{display:inline-block;font-size:11px;font-weight:700;padding:0 7px;border-radius:99px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--ct,var(--text));vertical-align:1px}
input[type=datetime-local]{font:inherit;font-size:15px;padding:7px 8px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.chk{display:flex!important;flex-direction:row!important;align-items:center;gap:8px;font-weight:400!important}

/* announcements */
.nb{font-style:normal;font-size:12px;font-weight:700;color:#fff;background:var(--err);border-radius:99px;padding:1px 8px;margin-inline-start:6px}
.ni{border-radius:12px;margin:0 0 6px;background:var(--row);border-inline-start:4px solid var(--c)}
.ni summary{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;list-style:none;font-weight:400}
.ni summary::-webkit-details-marker{display:none}
.ni .nt{flex:1;min-width:0;display:flex;flex-direction:column}
.ni .nt b{font-weight:600}
.ni.new .nt b{font-weight:800}
.ni.new summary::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--accent)}
.ni .nt small{color:var(--muted);font-size:12.5px}
.ni .nm{padding:0 12px 10px}
.ni pre{white-space:pre-wrap;font:inherit;font-size:14px;margin:0 0 6px;max-height:320px;overflow:auto}
.ni .nm a.op{color:var(--accent-t);font-weight:600;text-decoration:none;font-size:14px}
.ni .files{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}

/* forms (timetable editor, semester dates) */
input[type=date],input[type=time]{font:inherit;font-size:16px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text)}
.form label{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:14px;margin-bottom:10px}
.form select{width:100%}
.form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .frow{display:flex;gap:8px;margin-top:6px}
.form .frow button{flex:1}
.form textarea{font:inherit;font-size:16px;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);resize:vertical;width:100%;box-sizing:border-box}

/* ---------- tasks pane ---------- */
.banner{border-radius:12px;padding:10px 12px;margin-bottom:10px;font-size:14px}
.banner.err{background:var(--updbg);color:var(--err)}
#sum{margin:2px 2px 10px;color:var(--muted);font-size:14px}
#sum b{color:var(--text)}
#sum .late{color:var(--err)}
#sum .next{margin-top:3px}
.focus{display:flex;align-items:center;gap:8px;background:var(--accent-soft);color:var(--accent-t);border-radius:12px;padding:8px 12px;margin-bottom:10px;font-weight:600}
.focus span{flex:1}
.focus button{padding:4px 10px;background:var(--card)}
.chips{display:flex;gap:7px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none;margin:0 -2px}
.chips::-webkit-scrollbar{display:none}
.chip{--c:#888;flex:none;display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:99px;border:1px solid var(--line);background:var(--card);font-size:14px;opacity:.55;user-select:none;cursor:pointer}
.chip.on{opacity:1;border-color:var(--c);background:color-mix(in srgb,var(--c) 13%,var(--card))}
.chip i{width:10px;height:10px;border-radius:50%;background:var(--c);flex:none}
.chip .n{font-size:12px;color:var(--muted)}
.ctl{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:1;background:var(--card)}
.seg button{flex:1;border:0;border-radius:0;padding:9px 6px;background:none;font-size:14px}
.seg button.on{background:var(--accent);color:var(--on-accent);font-weight:600}
#q{margin-bottom:6px}
@media (min-width:1100px){ #list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px;align-items:start} #list .grp,#list .empty{grid-column:1/-1} }
.grp{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;font-weight:700;user-select:none;cursor:pointer}
.grp .tw{width:14px;color:var(--muted);font-size:13px}
.grp .cnt{font-weight:400;color:var(--muted);font-size:13px}
.grp.late{color:var(--err)}
.grp.old,.grp.nodue,.grp.done{color:var(--muted)}
.task,.grp,.chip,.tr{--ct:color-mix(in srgb,var(--c) var(--mixp),var(--mixk))}
.grp.cg{color:var(--ct);border-inline-start:5px solid var(--c);padding-inline-start:8px}
.task{--c:var(--line);position:relative;background:var(--card);border:1px solid var(--line);border-inline-start:5px solid var(--c);border-radius:14px;padding:12px 14px;margin-bottom:9px}
.task.done{opacity:.85}
.task.hid{opacity:.45}
.task.hl{box-shadow:0 0 0 3px var(--accent)}
.task .x{position:absolute;inset-block-start:4px;inset-inline-end:4px;width:40px;height:40px;padding:0;border:0;background:none;color:var(--muted);font-size:15px}
.task .tl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding-inline-end:34px}
.task .tname{font-weight:700;font-size:16px;width:100%}
.task .tc{font-size:12.5px;padding:1px 9px;border-radius:99px;color:var(--ct);background:color-mix(in srgb,var(--c) 13%,transparent);font-weight:600;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task .due{margin-top:6px;font-size:14px}
.task .rel{color:var(--muted)}
.cd{color:var(--muted);font-variant-numeric:tabular-nums}
.cd.soon{color:var(--warn);font-weight:700}
.cd.late{color:var(--err);font-weight:600}
.task .sub{color:var(--muted);font-size:13px}
.task pre{white-space:pre-wrap;font:inherit;margin:6px 0;font-size:14.5px}
.task .files{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.fl{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:6px 10px;border-radius:10px;background:var(--row);border:1px solid var(--line);color:var(--text);text-decoration:none;font-size:13.5px}
.fl span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fl small{color:var(--muted);flex:none}
.task .act{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:8px;align-items:center}
.task .act a,.task .act button{color:var(--accent-t);text-decoration:none;font-weight:600;display:inline-block;padding:6px 0;border:0;background:none;font-size:14.5px}
.st{font-size:12px;padding:2px 9px;border-radius:99px;font-weight:600}
.st.submitted,.st.manual{background:var(--okbg);color:var(--ok)}
.st.draft{background:var(--updbg);color:var(--warn)}
.st.none{background:var(--newbg);color:var(--new)}
.st.late{background:var(--updbg);color:var(--err)}
.st.na,.st.unknown{background:var(--track);color:var(--muted)}
.st.grade{background:var(--accent-soft);color:var(--accent-t)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.diag{margin-top:18px;font-size:13px;color:var(--muted)}
.diag div{direction:ltr;text-align:left;color:var(--err);word-break:break-word}

/* ---------- settings sheet ---------- */
.sheet{position:fixed;inset:0;background:#0007;z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet .box{background:var(--card);width:100%;max-width:720px;max-height:88vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px max(20px,env(safe-area-inset-bottom))}
@media (min-width:760px){ .sheet{align-items:center} .sheet .box{border-radius:18px;max-width:560px} }
.sheet h3{margin:0 0 10px;display:flex;justify-content:space-between;align-items:center}
.srow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow input[type=color]{width:38px;height:30px;border:0;padding:0;background:none}
.srow .cn{display:flex;align-items:center;gap:8px;min-width:0}
.srow .cn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:fit-content;max-width:90%;background:#222;color:#fff;padding:10px 16px;border-radius:12px;display:none;z-index:40;white-space:pre-line;font-size:14px}
@media (min-width:760px){ #toast{bottom:24px} }
</style>
</head>
<body>
<header class="top">
  <img class="logo" src="icon-any-192.png" alt="" width="34" height="34">
  <div class="ttl"><span><b class="wm" dir="ltr">Study<span>Pro</span></b> <span class="betatag" id="betaTag" hidden>BETA</span></span><span class="hint" id="upd"></span></div>
  <button class="ic" id="bRefresh" data-i18n-aria="refresh" aria-label="רענן" hidden>⟳</button>

</header>

<main>
<section id="setup" hidden>
  <div class="card">
    <div class="langrow"><span aria-hidden="true">🌐</span><select class="langSel" aria-label="Language"><option value="he">עברית</option><option value="en">English</option><option value="fr">Français</option></select></div>
    <div class="brand"><img src="icon-any-192.png" alt="" width="56" height="56"><div><b class="wm" dir="ltr">Study<span>Pro</span></b><div class="hint" data-i18n="brandTag"></div></div></div>
    <h2 data-i18n="setupTitle"></h2>
    <div class="hint" data-i18n="setupHint"></div>

      <div class="gvt"><b data-i18n="vidTitle"></b><span class="hint" id="vidNote"></span></div>
      <div class="gvbox">
        <video id="vid" src="media/guide-iphone.mp4" poster="media/guide-iphone.jpg" muted playsinline loop preload="metadata" controls></video>
        <ol class="gvcap" id="vidCap"></ol>
      </div>
    </div>
    <ol class="gsteps">
      <li class="gstep">
        <div class="gh"><span class="gn">1</span><b data-i18n="g1Title"></b></div>
        <a class="btn primary" id="bGet" target="_blank" rel="noopener noreferrer" data-i18n="getToken"></a>
        <div class="hint" data-i18n="g1Hint"></div>
      </li>
      <li class="gstep" id="gStep2">
        <div class="gh"><span class="gn">2</span><b data-i18n="g2Title"></b></div>
        <p class="gp" data-i18n-html="g2Text"></p>
        <div class="gtabs" role="tablist">
          <button data-plat="android" role="tab" data-i18n="platAndroid"></button>
          <button data-plat="ios" role="tab" data-i18n="platIos"></button>
          <button data-plat="pc" role="tab" data-i18n="platPc"></button>
        </div>
        <div class="ill" aria-hidden="true">
          <div class="ill-bar"><span>🔒 moodle.jct.ac.il</span></div>
          <div class="ill-page">
            <i class="ill-line"></i><i class="ill-line s"></i>
            <span class="ill-link" data-i18n="illLink"></span>
            <span class="ill-finger" id="illFinger">👆</span>
            <div class="ill-menu" id="illMenu"></div>
          </div>

        <div class="gnote warn">⚠️ <span data-i18n="step2hint"></span></div>
      </li>
      <li class="gstep">

      </li>
    </ol>
    <label for="tok" data-i18n="manual"></label>
    <input type="password" id="tok" autocomplete="off" data-i18n-ph="tokPh">

    <div class="err" id="setupErr"></div>
    <details>
      <summary data-i18n="otherSite"></summary>
      <input type="text" id="site" autocomplete="off">
    </details>
    <div class="hint" data-i18n-html="pcHint"></div>
  </div>
</section>

<div id="app" hidden>
  <section id="dash">
    <div id="hero" class="dcard hero"></div>
    <div id="todayCard" class="dcard today">
      <div class="ch"><span id="todayTitle"></span><button class="link" id="bTtGo" data-i18n="ttOpen"></button></div>
      <div id="today"></div>
    </div>
    <div id="examCard" class="dcard exams">
      <div class="ch"><span data-i18n="examsTitle"></span><button class="link" id="bExEdit" data-i18n="edit"></button></div>
      <div id="exams"></div>
    </div>
    <div id="stats" class="stats"></div>
    <div id="semCard" class="dcard sem">
      <div class="ch"><span data-i18n="semTitle"></span><button class="link" id="bSemEdit" data-i18n="edit"></button></div>
      <div id="sem"></div>
    </div>
    <div id="weekCard" class="dcard">
      <div class="ch"><span data-i18n="weekTitle"></span><span class="hint" data-i18n="tapDay"></span></div>

    <div id="monthCard" class="dcard">
      <div class="ch"><span id="mTitle"></span><span class="mnav"><button id="mPrev" data-i18n-aria="prevMonth">‹</button><button id="mToday" data-i18n="todayBtn"></button><button id="mNext" data-i18n-aria="nextMonth">›</button></span></div>

    </div>
    <div id="newsCard" class="dcard news">
      <div class="ch"><span><span data-i18n="newsTitle"></span><i class="nb" id="newsBadge" hidden></i></span><button class="link" id="bNewsRead" data-i18n="markAllRead" hidden></button></div>

  <section id="ttv">

      <div class="ch"><span data-i18n="ttTitle"></span><span class="ttb"><button id="bTtFile" data-i18n="ttImport"></button><button class="primary" id="bTtAdd" data-i18n="ttAdd"></button></span></div>

</main>

  <div class="box">

    <button id="bRem" style="width:100%;margin-top:14px" data-i18n="remTitle"></button>
    <button id="bTheme" style="width:100%;margin-top:8px"><span data-i18n="thTitle"></span> · <span class="thcur"></span></button>
    <button id="bDashArr" style="width:100%;margin-top:8px" data-i18n="daTitle"></button>
    <button id="bCal" style="width:100%;margin-top:8px" data-i18n="calBtn"></button>
    <button id="bTour" style="width:100%;margin-top:8px" data-i18n="tourOpen"></button>
    <button id="bInst" style="width:100%;margin-top:8px" hidden data-i18n="instTitle"></button>
    <div id="fbSet" hidden>
      <div style="margin-top:14px;font-weight:700" data-i18n="fbTitle"></div>
      <button id="bFb" style="width:100%;margin-top:6px" data-i18n="fbOpen"></button>
    </div>
    <div class="srow" style="margin-top:8px"><span class="hint" id="who"></span></div>
    <div class="srow"><span class="hint" id="verLine"></span><button class="link" id="bWn" data-i18n="wnTitle"></button></div>
    <button id="bUpd" style="width:100%;margin-top:6px" data-i18n="updCheck"></button>
    <p class="hint" style="margin:6px 2px 0" data-i18n="updHow"></p>

/* the beta (…/beta/) keeps its own copy of the data, started once from the regular app's data on this device */
const CHANNEL = /\/beta\//.test(location.pathname) ? "beta" : "stable";
const PFX = CHANNEL === "beta" ? "mtb_" : "mt_";
if (CHANNEL === "beta") { try { if (localStorage.getItem("mtb_init") === null) { for (const k of Object.keys(localStorage)) if (k.startsWith("mt_")) localStorage.setItem("mtb_" + k.slice(3), localStorage.getItem(k)); localStorage.setItem("mtb_init", "1"); } } catch (e) {} }
const LS = {
  get(k, d) { try { const v = localStorage.getItem(PFX + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(PFX + k, JSON.stringify(v)); } catch (e) {} },
  del(k) { try { localStorage.removeItem(PFX + k); } catch (e) {} },
};
function toast(m, ms) { const t = $("#toast"); t.textContent = m; t.style.display = "block"; clearTimeout(toast.t); toast.t = setTimeout(() => t.style.display = "none", ms || 3500); }

/* Back: every window that opens is a step in the browser's history, and so is every change of tab */
const NAV = { ready: false, skip: 0, open: [] };
function navInit() {
  if (NAV.ready) return; NAV.ready = true;
  history.replaceState({ v: V.view }, "");
  const watch = new MutationObserver(ms => {

    for (const m of ms) { const el = m.target, id = el.id;
      if (!el.hidden && !NAV.open.includes(id)) { NAV.open.push(id); opened.push(id); }
      else if (el.hidden && NAV.open.includes(id)) { NAV.open = NAV.open.filter(x => x !== id); closed.push(id); } }
    let step = history.state && closed.includes(history.state.w);       // the window on top was closed by its own button
    for (const id of opened) {
      if (step) { history.replaceState({ v: V.view, w: id }, ""); step = false; }   // one window replaced by the next (settings → reminders)
      else history.pushState({ v: V.view, w: id }, "");

    if (step) { NAV.skip++; history.back(); }                                      // take its step out of the history too
  });
  $$(".sheet, #tour").forEach(el => watch.observe(el, { attributes: true, attributeFilter: ["hidden"] }));

    const top = NAV.open[NAV.open.length - 1];
    if (top) { NAV.open.pop(); const el = document.getElementById(top); if (el) { if (top === "tour") closeTour(); else el.hidden = true; } return; }
    const v = (e.state && e.state.v) || "dash";
    if (v !== V.view) { if (v === "dash") V.focus = null; setView(v, true); render(); window.scrollTo(0, 0); }
  });
}

};
$("#bSyncNow").onclick = () => syncNow(true);
$("#bFb").onclick = openFb; $("#bFb2").onclick = openFb;
$("#fbClose").onclick = () => $("#fbSheet").hidden = true;
$("#fbSheet").addEventListener("click", e => { if (e.target.id === "fbSheet") $("#fbSheet").hidden = true; });
$("#fbMsg").addEventListener("input", e => LS.set("fbDraft", e.target.value));
$("#fbSend").onclick = sendFb;
$("#bSemAuto").onclick = () => { P.sem = {}; savePrefs(); render(); renderSheet(); };
snapAll();
window.addEventListener("hashchange", () => { if (!location.hash) return; if (importFromHash()) showMain(); else render(); });
$("#mPrev").onclick = () => { V.monthOff--; render(); };
$("#mNext").onclick = () => { V.monthOff++; render(); };
$("#mToday").onclick = () => { V.monthOff = 0; render(); };
$("#bFocusClear").onclick = () => {
  const back = V.focusFrom === "dash" && !wide(); V.focus = null; V.focusFrom = null;
  if (back) { if (history.state && history.state.v === "tasks") history.back(); else { setView("dash"); render(); window.scrollTo(0, 0); } } else render();
};
$("#tabbar").addEventListener("click", e => { const b = e.target.closest("[data-v]"); if (b) { setView(b.dataset.v); if (b.dataset.v === "dash") V.focus = null; render(); window.scrollTo(0, 0); } });
document.addEventListener("visibilitychange", () => {
  if (document.hidden || !M.token) return;
  if (!V.data || Date.now() / 1000 - V.data.at > 20) refresh(); else syncSoon(400);      // back in the app: fresh data (unless it was just loaded)
});
setInterval(() => { if (!document.hidden && M.token && V.data && Date.now() / 1000 - V.data.at >= 300) refresh(); }, 30000);   // open on screen: every 5 minutes
setInterval(() => { if (!document.hidden && V.data) render(); }, 60000);
setInterval(tick, 1000);
window.addEventListener("online", () => { if (M.token) refresh(); });

if ("serviceWorker" in navigator && location.protocol !== "file:") {
  const hadSw = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.register("sw.js").catch(() => {});
  navigator.serviceWorker.addEventListener("message", e => { if (e.data && e.data.type === "updated") showUpd(); });
  navigator.serviceWorker.addEventListener("controllerchange", () => { if (hadSw) showUpd(); });
}
function showUpd() { if (!$("#updBar").hidden) return; useHit("updBar"); $("#updBar").hidden = false; }
/* the stored copy of the page is refreshed in the background on every open: if it's a newer version than the one running, say so */
async function updWaiting() {
  try {
    if (!window.caches || !navigator.serviceWorker || !navigator.serviceWorker.controller) return;
    const here = location.href.split("#")[0].split("?")[0], r = await caches.match(here) || await caches.match(new URL("index.html", here).href);
    const v = r && (/const APP_VERSION = "([^"]+)"/.exec(await r.text()) || [])[1];
    if (v && v !== APP_VERSION) showUpd();
  } catch (e) {}
}
[4000, 12000].forEach(ms => setTimeout(updWaiting, ms));
document.addEventListener("visibilitychange", () => { if (!document.hidden) setTimeout(updWaiting, 4000); });
$("#updGo").onclick = () => { useHit("updGo"); location.reload(); };
async function checkUpd() {
  const b = $("#bUpd"); useHit("updCheck"); b.disabled = true;
  try {
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration(); if (reg) await reg.update().catch(() => {});
    // asked with cache "reload": the service worker goes to the network for these and keeps what it gets, so a reload shows it
    const [r] = await Promise.all([fetch("index.html", { cache: "reload" }), fetch("./", { cache: "reload" }).catch(() => null)]);
    if (!r.ok) throw new Error(r.status);
    const v = (/const APP_VERSION = "([^"]+)"/.exec(await r.text()) || [])[1];
    if (v && v !== APP_VERSION) { toast(t("updFound", v), 4000); setTimeout(() => location.reload(), 900); }
    else toast(t("updNone", APP_VERSION), 4000);
  } catch (e) { toast(t("updFail"), 4000); }
  b.disabled = false;
}
$("#bUpd").onclick = checkUpd;
if (pushSupported()) setTimeout(() => pushKey().catch(() => {}), 2500);
applyLang();
importFromHash();
if (LS.get("token", "")) showMain(); else showSetup();
</script>
</body>
